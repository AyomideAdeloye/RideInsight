{% extends "base.html" %}
{% block content %}
<div class="messages-page">

    <!-- Sidebar: conversations list -->
    <div class="messages-sidebar">
        <div class="messages-sidebar-header">
            <h3><i data-lucide="message-square"></i> Messages</h3>
            <button class="new-msg-btn" onclick="openNewMessage()" title="New message">
                <i data-lucide="pencil"></i>
            </button>
        </div>

        <!-- User search for new conversation -->
        <div class="new-msg-search" id="newMsgSearch" style="display:none;">
            <input id="userSearchInput" placeholder="Search users…" oninput="searchUsers(this.value)">
            <div id="userSearchResults" class="user-search-results"></div>
        </div>

        <!-- Conversations -->
        <div id="conversationsList" class="conversations-list">
            <p class="empty-state" style="padding:16px;">Loading…</p>
        </div>
    </div>

    <!-- Main: message thread -->
    <div class="messages-thread" id="messagesThread">
        {% if thread_user %}
        <div class="thread-header" id="threadHeader">
            <img src="{{ thread_user.avatar or '' }}" class="thread-avatar" onerror="this.style.display='none'">
            <strong>@{{ thread_user.username }}</strong>
            <a href="/profile/{{ thread_user.username }}" class="view-profile-link">View profile</a>
        </div>
        <div class="thread-messages" id="threadMessages"></div>
        <div class="thread-input">
            <input id="msgInput" placeholder="Write a message…" onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()"><i data-lucide="send"></i></button>
        </div>
        {% else %}
        <div class="thread-empty" id="threadEmpty">
            <i data-lucide="message-square" style="width:56px;height:56px;opacity:0.2;"></i>
            <p>Select a conversation or start a new one</p>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const THREAD_USER = {% if thread_user %}{{ thread_user | tojson }}{% else %}null{% endif %};
</script>
<script src="{{ url_for('static', filename='messages.js') }}"></script>
{% endblock %}
